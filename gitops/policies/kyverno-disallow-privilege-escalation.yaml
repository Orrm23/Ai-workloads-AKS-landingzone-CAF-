apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privilege escalation allows a process to gain more privileges than its parent.
      This policy enforces allowPrivilegeEscalation=false on all AI containers.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privilege-escalation
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: "Privilege escalation is prohibited on enterprise AI workloads."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
